<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Milionário - Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app" class="max-w-md mx-auto p-6">
        <!-- TELA DE LOGIN -->
        <div id="login-screen" class="mt-20 bg-neutral-900 p-8 rounded-3xl border border-neutral-800 shadow-2xl">
            <h1 class="text-3xl font-black text-center mb-2 uppercase tracking-tighter">O Milionário</h1>
            <p class="text-neutral-500 text-center mb-8 text-sm">Insira seus dados para entrar</p>
            
            <div class="space-y-4">
                <input id="user-input" type="text" placeholder="Nome de usuário" class="w-full bg-neutral-800 border border-neutral-700 p-4 rounded-xl outline-none focus:ring-2 focus:ring-yellow-500">
                <input id="pass-input" type="password" placeholder="Senha" class="w-full bg-neutral-800 border border-neutral-700 p-4 rounded-xl outline-none focus:ring-2 focus:ring-yellow-500">
                
                <button onclick="handleAuth(false)" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl hover:bg-yellow-400 transition-all">ENTRAR</button>
                <button onclick="handleAuth(true)" class="w-full text-neutral-500 font-bold py-2 text-xs uppercase tracking-widest">Registrar Nova Conta</button>
            </div>
        </div>

        <!-- TELA DE JOGO -->
        <div id="game-screen" class="hidden space-y-6">
            <header class="flex justify-between items-center py-4 border-b border-neutral-800">
                <div>
                    <p class="text-xs text-neutral-500 font-bold uppercase">Jogador</p>
                    <h2 id="display-name" class="font-bold text-yellow-500">---</h2>
                </div>
                <button onclick="location.reload()" class="text-neutral-500 text-xs font-bold bg-neutral-900 px-4 py-2 rounded-lg border border-neutral-800">SAIR</button>
            </header>

            <!-- Status da Sala -->
            <div class="bg-neutral-900 p-6 rounded-2xl border border-neutral-800">
                <h3 class="text-sm font-black text-neutral-500 uppercase mb-4 tracking-widest">Jogadores na Sala</h3>
                <div id="players-list" class="space-y-2"></div>
                <button id="draw-btn" onclick="startDraw()" class="hidden w-full mt-6 bg-emerald-600 text-white font-black py-4 rounded-xl">SORTEAR MILIONÁRIO</button>
            </div>

            <!-- Área de Missões -->
            <div id="mission-area" class="bg-neutral-900 p-6 rounded-2xl border border-neutral-800">
                <h3 class="text-xl font-black mb-4 italic">Suas 4 Missões</h3>
                <div class="space-y-3">
                    <input type="text" class="m-input w-full bg-neutral-800 border border-neutral-700 p-3 rounded-lg outline-none" placeholder="Missão 1">
                    <input type="text" class="m-input w-full bg-neutral-800 border border-neutral-700 p-3 rounded-lg outline-none" placeholder="Missão 2">
                    <input type="text" class="m-input w-full bg-neutral-800 border border-neutral-700 p-3 rounded-lg outline-none" placeholder="Missão 3">
                    <input type="text" class="m-input w-full bg-neutral-800 border border-neutral-700 p-3 rounded-lg outline-none" placeholder="Missão 4">
                </div>
                <button id="save-missions-btn" onclick="saveMissions()" class="w-full mt-6 bg-white text-black font-black py-4 rounded-xl">CONFIRMAR MISSÕES</button>
            </div>

            <!-- Painel do Resultado -->
            <div id="result-area" class="hidden">
                <div id="milionario-view" class="hidden bg-yellow-500 text-black p-8 rounded-3xl shadow-2xl">
                    <h2 class="text-4xl font-black mb-4 uppercase">Você é o Milionário!</h2>
                    <p class="font-bold mb-6 opacity-70">Complete estas tarefas agora:</p>
                    <div id="tasks-list" class="space-y-4"></div>
                </div>
                <div id="pobre-view" class="hidden bg-neutral-900 border-2 border-neutral-800 p-10 rounded-3xl text-center">
                    <h2 class="text-3xl font-black mb-4 italic opacity-30 tracking-tighter uppercase">Você é um Pobre...</h2>
                    <p class="text-neutral-400">O Milionário é:</p>
                    <p id="target-name" class="text-2xl font-black text-yellow-500 mt-2">---</p>
                </div>
                <button onclick="resetGame()" class="w-full mt-8 text-neutral-600 font-bold text-xs uppercase tracking-widest">Reiniciar Jogo</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myUser = null;
        const api = (path, body) => fetch(`/api${path}`, {
            method: body ? 'POST' : 'GET',
            headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : null
        }).then(r => r.json());

        async function handleAuth(isReg) {
            const username = document.getElementById('user-input').value;
            const password = document.getElementById('pass-input').value;
            const res = await api('/auth', { username, password, isRegistering: isReg });
            if(res.success) {
                myUser = username;
                document.getElementById('display-name').innerText = `@${username}`;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                updateStatus();
            } else alert(res.error);
        }

        async function updateStatus() {
            const data = await api('/status');
            const list = document.getElementById('players-list');
            list.innerHTML = data.players.map(p => `
                <div class="flex justify-between items-center p-3 bg-neutral-800 rounded-xl">
                    <span class="${p.username === myUser ? 'text-yellow-500 font-bold' : ''}">${p.username}</span>
                    <span class="text-[10px] font-black ${p.ready ? 'text-emerald-500' : 'text-neutral-600'}">
                        ${p.ready ? 'PRONTO' : 'PENDENTE'}
                    </span>
                </div>
            `).join('');

            const me = data.players.find(p => p.username === myUser);
            if(me?.ready) document.getElementById('mission-area').classList.add('hidden');

            if(data.players.length === 4 && data.game.status === 'LOBBY') {
                document.getElementById('draw-btn').classList.remove('hidden');
            }

            if(data.game.status === 'PLAYING') {
                document.getElementById('mission-area').classList.add('hidden');
                document.getElementById('result-area').classList.remove('hidden');
                document.getElementById('draw-btn').classList.add('hidden');
                
                if(data.game.millionaire_name === myUser) {
                    document.getElementById('milionario-view').classList.remove('hidden');
                    const missions = JSON.parse(data.game.assigned_missions);
                    document.getElementById('tasks-list').innerHTML = missions.map(m => `
                        <div class="bg-black/10 p-4 rounded-xl border border-black/10">
                            <p class="text-[9px] font-black uppercase opacity-50">De @${m.from}</p>
                            <p class="text-lg font-bold">"${m.text}"</p>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('pobre-view').classList.remove('hidden');
                    document.getElementById('target-name').innerText = `@${data.game.millionaire_name}`;
                }
            } else {
                document.getElementById('result-area').classList.add('hidden');
                document.getElementById('milionario-view').classList.add('hidden');
                document.getElementById('pobre-view').classList.add('hidden');
            }
        }

        async function saveMissions() {
            const inputs = document.querySelectorAll('.m-input');
            const missions = Array.from(inputs).map(i => i.value);
            if(missions.some(m => !m)) return alert("Preencha todas!");
            await api('/missions', { username: myUser, missions });
            updateStatus();
        }

        async function startDraw() {
            await api('/draw');
        }

        async function resetGame() {
            await api('/reset');
        }

        socket.on('update', updateStatus);
        socket.on('gameStarted', updateStatus);
    </script>
</body>
</html>
